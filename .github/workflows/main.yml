# This is a basic workflow to help you get started with Actions
name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  pull_request:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  check-source-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Check source branch from staging
        if: ${{ (github.head_ref || github.ref_name) !='staging' }}
        uses: actions/github-script@v6
        with:
          script: |
            core.setFailed('Changes to prod should merge from staging')

  test:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      # Runs a single command using the runners shell
      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
      # Setup SSH so that we can install dependencies
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Setup Git
        run: |
          git config user.name "CRO Bot"
          git config user.email "conversion@journeyfurther.com"
      - run: yarn install --frozen-lockfile
      - run: yarn test

  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      # Runs a single command using the runners shell
      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # Setup SSH so that we can install dependencies
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Setup Git
        run: |
          git config user.name "CRO Bot"
          git config user.email "conversion@journeyfurther.com"
      - run: yarn install --frozen-lockfile
      - run: yarn build
