name: Release
on:
  push:
    branches:
      - main
      - staging
jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/checkout@v3
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Build Release
        run: yarn build
      - name: Release
        run: npx semantic-release
